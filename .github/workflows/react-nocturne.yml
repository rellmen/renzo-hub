name: React Nocturne — Authentic Build (no release)

on:
  pull_request:
    branches: [staging]
    paths:
      - "apps/rise-react/**"
      - "tools/react-cutover-audit.mjs"
      - "tests/e2e/react-authenticated-ui-mock.mjs"
      - ".github/workflows/react-nocturne.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install React source dependencies
        working-directory: apps/rise-react
        run: npm install --no-audit --no-fund --no-package-lock
      - name: TypeScript check (includes migrated Ares, Projects and Home)
        working-directory: apps/rise-react
        run: ./node_modules/.bin/tsc --noEmit
      - name: React component regressions (including gated FSRS retries)
        working-directory: apps/rise-react
        run: npm test
      - name: Verify seven original Lovable JPEGs (SHA-256 from uploaded ZIP)
        working-directory: apps/rise-react
        shell: bash
        run: |
          set -Eeuo pipefail
          : > /tmp/nocturne-originals.sha256
          echo '64966f0a2c006b41b108d931cb94e112e78ac612498fc46fdcfc1b6b5da22b6c  src/assets/ares.jpg' >> /tmp/nocturne-originals.sha256
          echo '3e40a74c352e2e27034019b9f49aa48143d93f8d004c7da94ebf4d61e5843a7f  src/assets/gym.jpg' >> /tmp/nocturne-originals.sha256
          echo '0a30afaadc541981bd629723c5218c851b4f46c535f38f6ffb2c9ae7eee9b01f  src/assets/hero-eclipse.jpg' >> /tmp/nocturne-originals.sha256
          echo '82f35b9c7a262b5aa74b56805c6daa1b97ab05220bc3509aa55552a7cab18110  src/assets/learn.jpg' >> /tmp/nocturne-originals.sha256
          echo 'b93aa8e4b802e6a69d0c64b8711f2d2da6ddd698163bd6e5320498a4189b773a  src/assets/money.jpg' >> /tmp/nocturne-originals.sha256
          echo '5b252f641b7fd10c0fc3da6c1804bb4b6afed2fbfac716289a6bf2b534d803d1  src/assets/projects.jpg' >> /tmp/nocturne-originals.sha256
          echo 'fde9d6d7235e5c9e15a2b82281611f93cf7406f52c9141c3d1944c2b0b830e55  src/assets/skin.jpg' >> /tmp/nocturne-originals.sha256
          sha256sum --check /tmp/nocturne-originals.sha256
      - name: Build React with verified ORIGINAL assets (never demo placeholders)
        working-directory: apps/rise-react
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_1234567890
        run: npm run build
      - name: Install browsers for unauthenticated React UI QA
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
      - name: React hydration, login screen and PWA smoke via Vite dev (no real accounts)
        working-directory: apps/rise-react
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_1234567890
        run: |
          npm run dev -- --host 127.0.0.1 --port 4174 >/tmp/rise-react-preview.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:4174/ >/dev/null; then cat /tmp/rise-react-preview.log; exit 1; fi
          REACT_QA_BASE_URL=http://127.0.0.1:4174 node ../../tests/e2e/react-auth-smoke.mjs || { cat /tmp/rise-react-preview.log; exit 1; }
          REACT_QA_BASE_URL=http://127.0.0.1:4174 node ../../tests/e2e/react-authenticated-ui-mock.mjs || { cat /tmp/rise-react-preview.log; exit 1; }
      - name: React release blocker report (informational)
        run: node tools/react-cutover-audit.mjs

# No production deployment is triggered by this workflow; bundle output is a QA build only.
# Original assets are checked by SHA256 on every run. A green build does not
# bypass domain integration, authenticated staging security QA or iPhone PWA QA.
