name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging, "feature/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sintaxis JS
        run: npm run check
      - name: Tests unitarios
        run: npm test
      - name: Smoke test de navegador (sin datos reales)
        env:
          # Valores ficticios: el smoke test no inicia sesión ni toca Supabase real.
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          BASE_URL: http://localhost:4173
        run: |
          npx playwright install --with-deps chromium webkit
          node tools/dev-server.mjs 4173 &
          sleep 1
          node tests/e2e/smoke.mjs
      - name: E2E de Nóminas (datos ficticios, Chromium y WebKit)
        run: node tests/e2e/payroll.mjs

  db-migrations:
    # Réplica local PostgreSQL 17 con los privilegios reales de producción (sin conectar a Supabase).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-17
      - name: Migraciones, RLS y rollback en réplica
        run: |
          sudo -E bash tools/db-replica/run.sh
          sudo -E bash tools/db-replica/pay_date_test.sh
          sudo -E bash tools/db-replica/payroll_schema_test.sh
          sudo -E bash tools/db-replica/payroll_upload_test.sh
          sudo -E bash tools/db-replica/buckets_test.sh
