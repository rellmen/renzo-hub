name: Import original Lovable JPEGs (one-shot)
on:
  push:
    branches: ["feature/react-nocturne-body-food"]
    paths:
      - "asset-transfer/lovable-seven-originals.patch"
      - ".github/workflows/import-nocturne-assets.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and restore exactly seven original JPEGs
        shell: bash
        run: |
          set -euo pipefail
          git apply --binary --check asset-transfer/lovable-seven-originals.patch
          git apply --binary --index asset-transfer/lovable-seven-originals.patch
          : > /tmp/lovable.sha256
          echo '64966f0a2c006b41b108d931cb94e112e78ac612498fc46fdcfc1b6b5da22b6c  apps/rise-react/src/assets/ares.jpg' >> /tmp/lovable.sha256
          echo '3e40a74c352e2e27034019b9f49aa48143d93f8d004c7da94ebf4d61e5843a7f  apps/rise-react/src/assets/gym.jpg' >> /tmp/lovable.sha256
          echo '0a30afaadc541981bd629723c5218c851b4f46c535f38f6ffb2c9ae7eee9b01f  apps/rise-react/src/assets/hero-eclipse.jpg' >> /tmp/lovable.sha256
          echo '82f35b9c7a262b5aa74b56805c6daa1b97ab05220bc3509aa55552a7cab18110  apps/rise-react/src/assets/learn.jpg' >> /tmp/lovable.sha256
          echo 'b93aa8e4b802e6a69d0c64b8711f2d2da6ddd698163bd6e5320498a4189b773a  apps/rise-react/src/assets/money.jpg' >> /tmp/lovable.sha256
          echo '5b252f641b7fd10c0fc3da6c1804bb4b6afed2fbfac716289a6bf2b534d803d1  apps/rise-react/src/assets/projects.jpg' >> /tmp/lovable.sha256
          echo 'fde9d6d7235e5c9e15a2b82281611f93cf7406f52c9141c3d1944c2b0b830e55  apps/rise-react/src/assets/skin.jpg' >> /tmp/lovable.sha256
          sha256sum --check /tmp/lovable.sha256
          count=$(find apps/rise-react/src/assets -maxdepth 1 -type f -name '*.jpg' | wc -l)
          test "$count" -eq 7
          echo "Verified exactly seven binary JPEGs against user-provided ZIP."
      - name: Commit originals and discard one-shot transfer material
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f asset-transfer/lovable-seven-originals.patch .github/workflows/import-nocturne-assets.yml
          git add -- apps/rise-react/src/assets/*.jpg
          git commit -m "[chatgpt] assets: restore seven original Lovable JPEGs verified by SHA-256"
          git push origin HEAD:refs/heads/feature/react-nocturne-body-food
